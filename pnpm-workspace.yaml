packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"

overrides:
  "@types/react": "19.0.5"
  "@types/react-dom": "19.0.5"
  "tsconfig-paths": "^4.2.0"

# pnpm 11+
allowBuilds:
  "@medusajs/telemetry": true
  "@swc/core": true
  core-js: false
  "esbuild": true
  "msgpackr-extract": true
  "protobufjs": true
  "unrs-resolver": true

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"
  - "@swc/core"
  - "esbuild"
  - "msgpackr-extract"
  - "protobufjs"
  - "unrs-resolver"
